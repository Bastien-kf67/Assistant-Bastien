[versions]
agp = "8.7.3"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"
coreKtx = "1.15.0"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
composeBom = "2024.12.01"
glance = "1.1.1"
room = "2.6.1"
work = "2.9.1"
appauth = "0.11.1"
okhttp = "4.12.0"
biometric = "1.1.0"
fragment = "1.8.5"
junit = "4.13.2"
robolectric = "4.14.1"

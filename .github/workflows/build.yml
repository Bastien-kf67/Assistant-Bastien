name: Compilation

# À chaque envoi sur dev ou main : tests, APK signé, publication sur la page « Releases » du dépôt.
on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Préparer la clé de signature
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ASSISTANT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/assistant.jks"
            echo "ASSISTANT_KEYSTORE_PATH=$RUNNER_TEMP/assistant.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Clé de signature absente : compilation et tests seulement, aucun APK publié."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Vérifier la clé de l'IA
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Ne jamais afficher la clé : seulement sa présence et son format.
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning title=IA::Clé ANTHROPIC_API_KEY absente : IA désactivée dans cette version."
          elif [[ "$ANTHROPIC_API_KEY" == sk-ant-* ]]; then
            echo "::notice title=IA::Clé présente (format attendu)."
          else
            echo "::warning title=IA::Clé présente mais format inattendu (doit commencer par sk-ant-)."
          fi

      - name: Tests et compilation
        shell: bash
        env:
          ASSISTANT_KEYSTORE_PASSWORD: ${{ secrets.ASSISTANT_KEYSTORE_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          gradle --no-daemon --continue testReleaseUnitTest assembleRelease \
            -PversionCode=${{ github.run_number }} 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Résumé tests et erreurs
        if: always()
        run: python3 .github/scripts/summarize.py "$RUNNER_TEMP/gradle.log"

      - name: Rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Schéma de la base
        uses: actions/upload-artifact@v4
        with:
          name: schema-base
          path: app/schemas/
          if-no-files-found: ignore

      # Jamais d'APK publié sans la clé fixe : une autre signature obligerait à désinstaller,
      # donc à perdre les captures. Une ancienne version non signée est retirée.
      - name: Retirer un APK publié sans la clé fixe
        if: steps.signing.outputs.signed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$BRANCH" = "main" ]; then TAG="stable"; else TAG="test"; fi
          gh release delete "$TAG" --yes --cleanup-tag || true

      - name: Publier l'APK
        if: steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          RUN: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$BRANCH" = "main" ]; then TAG="stable"; FLAG="--latest"; else TAG="test"; FLAG="--prerelease"; fi
          APK="assistant-$TAG-$RUN.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" "$APK" --target "$SHA" $FLAG \
            --title "Assistant — version $TAG n°$RUN" \
            --notes "Version 0.1.$RUN compilée depuis la branche $BRANCH. Sur le téléphone : télécharger le fichier .apk ci-dessous, l'ouvrir, installer."
